name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://travel_buddy:travel_buddy@localhost:5432/travel_buddy_reach
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @travel-buddy/contracts build

      - name: Validate database schema
        run: pnpm --filter @travel-buddy/database typecheck

      - name: Build database package
        run: pnpm --filter @travel-buddy/database build

      - name: Type-check API
        run: pnpm --filter @travel-buddy/api typecheck

      - name: Type-check mobile app
        run: pnpm --filter @travel-buddy/mobile typecheck

      - name: Test contracts
        run: pnpm --filter @travel-buddy/contracts test

      - name: Test API
        run: pnpm --filter @travel-buddy/api test

      - name: Build API
        run: pnpm --filter @travel-buddy/api build

      - name: Build web application
        run: pnpm --filter @travel-buddy/web build