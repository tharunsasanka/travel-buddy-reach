services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: travel_buddy_reach
      POSTGRES_USER: travel_buddy
      POSTGRES_PASSWORD: travel_buddy
    ports:
      - "55432:5432"
    volumes:
      - travel_buddy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_buddy -d travel_buddy_reach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_buddy_postgres:

